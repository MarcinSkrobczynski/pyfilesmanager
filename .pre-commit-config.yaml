exclude: .idea|.git|.vscode

default_stages:
  - pre-commit
  - pre-push

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: debug-statements
      - id: check-yaml
        args:
          - "--unsafe"
      - id: check-json
      - id: check-toml
      - id: check-xml
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-symlinks
      - id: detect-private-key
      - id: sort-simple-yaml

  - repo: https://github.com/mrtazz/checkmake
    rev: d9141dbfb788dadf057b409700a13017b3cd4f0c # v0.3.0
    hooks:
      - id: checkmake

  - repo: https://github.com/google/yamlfmt
    rev: 21ca5323a9c87ee37a434e0ca908efc0a89daa07 # v0.21.0
    hooks:
      - id: yamlfmt

  - repo: https://github.com/ComPWA/mirrors-taplo
    rev: ade0f95ddcf661c697d4670d2cfcbe95d0048a0a # v0.9.3
    hooks:
      - id: taplo-format
      - id: taplo-lint
        args:
          - "--no-schema"

  - repo: https://github.com/charliermarsh/ruff-pre-commit
    rev: 6fec9b7edb08fd9989088709d864a7826dc74e80 # v0.15.12
    hooks:
      - id: ruff-format
      - id: ruff-check
        args:
          - "--fix"
